<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紐西蘭 Sep 2025 行程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --blue: #4EAFC4;
  --navy: #1E2D3D;
  --gold: #C9A84C;
  --bg: #F7F9FA;
  --gray: #6B7280;
  --card: #ffffff;
  --open: #22c55e;
  --closed: #ef4444;
  --soon: #f59e0b;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(30,45,61,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--navy); }

/* NAV */
#topnav {
  position: sticky; top: 0; z-index: 1000;
  background: var(--navy); color: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.nav-row1 {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.nav-title { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 700; color: var(--gold); flex: 1; }
.island-btn {
  padding: 5px 16px; border-radius: 20px; border: 1.5px solid var(--blue);
  background: transparent; color: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 500;
  transition: all 0.2s;
}
.island-btn.active { background: var(--blue); border-color: var(--blue); }
.nav-row2 {
  display: flex; gap: 4px; padding: 6px 12px;
  overflow-x: auto; scrollbar-width: none;
}
.nav-row2::-webkit-scrollbar { display: none; }
.day-btn {
  flex-shrink: 0; padding: 4px 10px; border-radius: 12px;
  border: none; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7);
  cursor: pointer; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace;
  transition: all 0.2s;
}
.day-btn:hover { background: rgba(78,175,196,0.3); color: #fff; }
.day-btn.active { background: var(--blue); color: #fff; }

/* LAYOUT */
#main-layout {
  display: grid;
  grid-template-columns: 1fr 380px;
  min-height: calc(100vh - 90px);
}
#timeline-col { overflow-y: auto; padding: 0 0 60px 0; }
#map-col {
  position: sticky; top: 90px;
  height: calc(100vh - 90px);
  border-left: 1px solid #e5e7eb;
}
#map { width: 100%; height: 100%; }

/* DAY SECTION */
.day-section {
  border-bottom: 1px solid #e9ecef;
  padding: 0;
  scroll-margin-top: 90px;
}
.day-hero {
  position: relative; height: 180px; overflow: hidden;
  background: var(--navy);
}
.day-hero img {
  width: 100%; height: 100%; object-fit: cover; opacity: 0.75;
  transition: opacity 0.3s;
}
.day-hero-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 16px 20px;
  background: linear-gradient(transparent, rgba(30,45,61,0.85));
}
.day-label {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  color: var(--gold); letter-spacing: 0.1em; text-transform: uppercase;
}
.day-title {
  font-family: 'Cormorant Garamond', serif; font-size: 1.7rem; font-weight: 700;
  color: #fff; line-height: 1.2;
}
.day-subtitle { font-size: 0.8rem; color: rgba(255,255,255,0.75); margin-top: 2px; }

.day-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }

/* ROUTE BADGE */
.route-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 8px;
  font-size: 0.8rem; font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
}
.route-badge.ok { background: #dcfce7; color: #166534; }
.route-badge.detour { background: #fef3c7; color: #92400e; }
.route-badge .icon { font-size: 1rem; }

/* TIMELINE */
.timeline { list-style: none; border-left: 2px solid #e5e7eb; margin-left: 8px; padding-left: 16px; }
.timeline li {
  position: relative; padding: 4px 0 8px 0;
  font-size: 0.82rem; color: var(--navy);
}
.timeline li::before {
  content: ''; position: absolute; left: -21px; top: 8px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--blue); border: 2px solid #fff;
  box-shadow: 0 0 0 1px var(--blue);
}
.tl-time {
  font-family: 'JetBrains Mono', monospace; font-size: 0.72rem;
  color: var(--gray); margin-right: 6px;
}

/* SECTION HEADER */
.sec-header {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--gray); margin-bottom: 8px;
}
.sec-header span { font-size: 1rem; }

/* ATTRACTION CARDS */
.attraction-list { display: flex; flex-direction: column; gap: 8px; }
.attraction-card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid #e9ecef; padding: 10px 12px;
  display: flex; align-items: flex-start; gap: 10px;
  box-shadow: var(--shadow);
}
.attr-icon { font-size: 1.4rem; flex-shrink: 0; margin-top: 2px; }
.attr-body { flex: 1; min-width: 0; }
.attr-name { font-weight: 600; font-size: 0.88rem; }
.attr-desc { font-size: 0.75rem; color: var(--gray); margin-top: 2px; line-height: 1.4; }
.attr-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.attr-hours {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  color: var(--gray);
}
.status-dot {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.7rem; font-weight: 600; padding: 2px 7px;
  border-radius: 10px;
}
.status-dot.open { background: #dcfce7; color: #15803d; }
.status-dot.closed { background: #fee2e2; color: #dc2626; }
.status-dot.soon { background: #fef3c7; color: #b45309; }
.status-dot::before { content: '●'; font-size: 0.5rem; }
.attr-price {
  font-size: 0.7rem; color: var(--gray);
  padding: 2px 6px; background: #f3f4f6; border-radius: 6px;
}

/* RESTAURANT TABS */
.meal-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.meal-tab {
  padding: 4px 10px; border-radius: 8px; border: none;
  font-size: 0.75rem; cursor: pointer; font-weight: 500;
  background: #f3f4f6; color: var(--gray);
  transition: all 0.15s;
}
.meal-tab.active { background: var(--navy); color: #fff; }
.meal-panel { display: none; flex-direction: column; gap: 6px; }
.meal-panel.active { display: flex; }
.rest-card {
  background: var(--card); border-radius: var(--radius);
  border: 1px solid #e9ecef; padding: 10px 12px;
  display: flex; gap: 10px; align-items: flex-start;
  box-shadow: var(--shadow);
}
.rest-rank {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  background: var(--navy); color: var(--gold);
  font-size: 0.7rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
}
.rest-body { flex: 1; min-width: 0; }
.rest-name { font-weight: 600; font-size: 0.88rem; }
.rest-type { font-size: 0.73rem; color: var(--gray); }
.rest-meta { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.rest-price {
  font-size: 0.7rem; color: var(--blue); font-weight: 600;
  padding: 1px 6px; background: #eff9fc; border-radius: 6px;
}
.rest-hours {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  color: var(--gray);
}
.rest-badge {
  font-size: 0.65rem; padding: 1px 6px; border-radius: 6px;
  background: #fef3c7; color: #92400e;
}
.rest-badge.confirm { background: #dcfce7; color: #166534; }

/* WARNING BOX */
.warn-box {
  background: #fef9ec; border: 1px solid #fcd34d; border-radius: 8px;
  padding: 8px 12px; font-size: 0.78rem; color: #78350f;
  display: flex; gap: 8px; align-items: flex-start;
}

/* MOBILE */
@media (max-width: 768px) {
  #main-layout { grid-template-columns: 1fr; }
  #map-col {
    position: relative; top: 0; height: 240px;
    border-left: none; border-bottom: 1px solid #e5e7eb;
  }
  .day-title { font-size: 1.3rem; }
}
</style>
</head>
<body>

<nav id="topnav">
  <div class="nav-row1">
    <div class="nav-title">🇳🇿 紐西蘭 Sep–Oct 2025</div>
    <button class="island-btn active" onclick="filterIsland('south')">南島</button>
    <button class="island-btn" onclick="filterIsland('north')">北島</button>
  </div>
  <div class="nav-row2" id="dayNav"></div>
</nav>

<div id="main-layout">
  <div id="timeline-col" id="timelineCol"></div>
  <div id="map-col"><div id="map"></div></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
